name: Build CertLedger IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    # Catatan: Pastikan 'macos-26' adalah nama runner yang benar jika Anda menggunakan self-hosted runner. 
    # Jika menggunakan runner bawaan GitHub, gunakan 'macos-latest'.
    runs-on: macos-latest 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Tambahkan langkah untuk menginstal XcodeGen
      - name: Install XcodeGen
        run: brew install xcodegen

      # 2. Generate file .xcodeproj dari project.yml
      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode
        run: |
          # Sesuaikan dengan versi Xcode yang tersedia di runner Anda
          sudo xcode-select -s /Applications/Xcode_26.0.1.app || echo "Xcode path might differ, using default"
          xcodebuild -version

      - name: Build App
        run: |
          # Karena XcodeGen sudah dijalankan, nama project-nya pasti CertLedger.xcodeproj
          PROJECT="CertLedger.xcodeproj"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: CertLedger.xcodeproj tidak ditemukan! Pastikan project.yml ada di root."
            exit 1
          fi

          echo "Using project: $PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -scheme CertLedger \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            PRODUCT_NAME=CertLedger \
            EXECUTABLE_NAME=CertLedger \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/CertLedger.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: CertLedger.app not found!"
            find build -name "*.app" -print
            exit 1
          fi

          rm -rf IPA
          mkdir -p IPA/Payload

          cp -R "$APP_PATH" IPA/Payload/

          cd IPA
          zip -r ../CertLedger.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CertLedger-IPA
          path: CertLedger.ipa
