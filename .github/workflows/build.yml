name: Build CertLedger IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Xcode Project
        run: |
          echo "Searching for Xcode project..."
          find . -name "*.xcodeproj" -maxdepth 5 -print

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app
          xcodebuild -version

      - name: Build App
        run: |
          PROJECT=$(find . -name "*.xcodeproj" -maxdepth 5 | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No .xcodeproj found!"
            exit 1
          fi

          echo "Using project: $PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -scheme CertLedger \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/CertLedger.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: CertLedger.app not found!"
            find build -name "*.app" -print
            exit 1
          fi

          mkdir -p IPA/Payload
          cp -R "$APP_PATH" IPA/Payload/

          cd IPA
          zip -r ../CertLedger.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CertLedger-IPA
          path: CertLedger.ipa
