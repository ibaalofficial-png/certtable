name: Build CertLedger

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app

      - name: Build
        run: |
          xcodebuild \
            -project CertLedger.xcodeproj \
            -scheme CertLedger \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            | xcpretty

      - name: Package unsigned app
        run: |
          mkdir -p artifact
          cp -R ~/Library/Developer/Xcode/DerivedData/CertLedger-*/Build/Products/Release-iphoneos/CertLedger.app artifact/ || true
          zip -r CertLedger-unsigned.zip artifact/CertLedger.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CertLedger-unsigned
          path: CertLedger-unsigned.zip
