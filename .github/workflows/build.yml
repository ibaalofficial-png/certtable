name: Build CertLedger IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          # 1. Cari file project.yml di semua subfolder (kebal huruf besar/kecil)
          SPEC_PATH=$(find . -iname "project.yml" -maxdepth 5 | head -n 1)
          
          if [ -z "$SPEC_PATH" ]; then
            echo "ERROR: project.yml tidak ditemukan di repository!"
            echo "Pastikan Anda sudah men-commit dan push file project.yml ke GitHub."
            exit 1
          fi
          
          # 2. Pindah ke direktori tempat project.yml berada dan jalankan xcodegen
          SPEC_DIR=$(dirname "$SPEC_PATH")
          echo "Menjalankan XcodeGen di direktori: $SPEC_DIR"
          
          cd "$SPEC_DIR"
          xcodegen generate

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app || echo "Menggunakan versi Xcode default"
          xcodebuild -version

      - name: Build App
        run: |
          # 3. Cari kembali file .xcodeproj yang baru saja di-generate oleh XcodeGen
          PROJECT=$(find . -name "*.xcodeproj" -maxdepth 5 | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: File .xcodeproj tidak ditemukan setelah xcodegen dijalankan!"
            exit 1
          fi

          echo "Menggunakan project: $PROJECT"

          # 4. Build aplikasi (hasil build akan disatukan di folder 'build' di root)
          xcodebuild \
            -project "$PROJECT" \
            -scheme CertLedger \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            PRODUCT_NAME=CertLedger \
            EXECUTABLE_NAME=CertLedger \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          # 5. Cari letak pasti dari .app yang berhasil di-build
          APP_PATH=$(find build -type d -name "CertLedger.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: CertLedger.app tidak ditemukan di hasil build!"
            exit 1
          fi
          
          echo "Ditemukan App di: $APP_PATH"

          rm -rf IPA
          mkdir -p IPA/Payload

          cp -R "$APP_PATH" IPA/Payload/

          cd IPA
          zip -r ../CertLedger.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CertLedger-IPA
          path: CertLedger.ipa
