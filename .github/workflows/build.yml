- name: Build App
  run: |
    PROJECT=$(find . -name "*.xcodeproj" -maxdepth 5 | head -n 1)

    if [ -z "$PROJECT" ]; then
      echo "ERROR: No .xcodeproj found!"
      exit 1
    fi

    echo "Using project: $PROJECT"

    xcodebuild \
      -project "$PROJECT" \
      -scheme CertLedger \
      -configuration Release \
      -sdk iphoneos \
      -derivedDataPath build \
      PRODUCT_NAME=CertLedger \
      EXECUTABLE_NAME=CertLedger \
      CODE_SIGNING_ALLOWED=NO \
      CODE_SIGNING_REQUIRED=NO \
      build
